<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
</head>
<body>
    <div class="container">
        <div class="row align-item-center justify-content-center min-vh-100">
            <div class="col-lg-4">
                <div class="card">
                    <div class="card-header bg-success text-center text-white">
                        <i class="bi bi-person-circle display-4"></i>
                        <h2>Welcome</h2>
                    </div><!--end card-header-->
                    <div class="card-body">
                        <div class="mb-3">
                            <label for="email">Email</label>
                            <div class="input-group">
                                <span class="input-group-text">
                                    <i class="bi bi-envelope"></i>
                                </span>
                                <input type="email" class="form-control" id="email" placeholder="Enter your email">
                            </div>
                        </div><!--end mb-3(1)-->
                        <div class="mb-3">
                            <label for="email">Password</label>
                            <div class="input-group">
                                <span class="input-group-text">
                                    <i class="bi bi-lock"></i>
                                </span>
                                <input type="password" class="form-control" id="password" placeholder="Enter your password">
                            </div>
                        </div><!--end mb-3(2)-->
                        <div class="d-flex justify-content-between">
                            <div class="form-check">
                                <input type="checkbox" class="form-check-input">
                                <label for="" class="form-check-label"> Remember me</label>
                            </div>
                            <a href="#" class="fw-semibold text-decoration-none text-success">Forgot Password?</a>
                        </div><!--end d-flex justufy-->
                        <div class="text-center my-3">
                            <span class="text-muted">OR</span>
                        </div>
                        <div class="btn-group">
                            <button type="button" class="btn btn-outline-danger">
                                <i class="bi bi-google me-2"></i>
                                Login with Google
                            </button>
                            <button type="button" class="btn btn-outline-primary">
                                <i class="bi bi-facebook me-2"></i>
                                Login with Facebook
                            </button>
                        </div>
                    </div><!--end card-body-->
                    <div class="card-footer text-end">
                        <button type="button" class="btn btn-success">
                            <i class="bi bi-box-arrow-in-right me-2"></i>
                            LOGIN
                        </button>
                    </div>
                </div><!--end card-->
            </div><!--end col-lg-->
        </div><!--end row-->
    </div><!--end container-->
</body>
</html>
