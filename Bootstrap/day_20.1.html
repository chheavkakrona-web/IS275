<head>

<body>
    <div class="container my-5">
        <button class="btn btn-success" type="button" data-bs-toggle="offcanvas" data-bs-target="#demo">
            Open Offcanvas
        </button>
    </div>
    <div class="offcanvas offcanvas-start " id="demo">
        <div class="offcanvas-header bg-dark text-light">
            <h5 class="offcanvas-title">Heading</h5>
            <button type="button" class="btn-close btn-close-white" data-bs-dismiss="offcanvas"></button>
        </div>
        <div class="offcanvas-body">
            <h3>Phone</h3>
            <ul class="list-group">
                <li class="list-group-item list-group-item-action">iPhone</li>
                <li class="list-group-item list-group-item-action">Samsung</li>
                <li class="list-group-item list-group-item-action">OnePlus</li>
                <li class="list-group-item list-group-item-action">Google Pixel</li>
                <li class="list-group-item list-group-item-action">Google Pixel</li>
            </ul>
        </div>
    </div>
