<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link href="assets/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="assets/dist/js/bootstrap.bundle.min.js"></script>
    <style>

    </style>
</head>

<body>
    <div class="container mt-3">
        <h4 class="my-5">Tooltip</h4>
        <div class="row">
            <div class="col-md-4"></div>
            <div class="col-md-4">
                <button type="button" class="btn btn-success" data-bs-toggle="tooltip"
                    title="Cambodian Mekong University" data-bs-placement="bottom">
                    Mouse Over
                </button>
                <button type="button" class="btn btn-success" data-bs-toggle="tooltip"
                    title="Cambodian Mekong University" data-bs-placement="left">
                    Mouse Over
                </button>
                <button type="button" class="btn btn-success" data-bs-toggle="tooltip"
                    title="Cambodian Mekong University" data-bs-placement="right">
                    Mouse Over
                </button>
            </div>
            <div class="col-md-4"></div>
        </div>
    </div>

    <script>
        var tooltipTriggerList = [].slice.call(document.querySelectorAll('[data-bs-toggle="tooltip"]'));
        var tooltipList = tooltipTriggerList.map(function (tooltipTriggerEl) {
            return new bootstrap.Tooltip(tooltipTriggerEl)
        });
    </script>
</body>

</html>
