<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link href="assets/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="assets/dist/js/bootstrap.bundle.min.js"></script>
    <style>
        
    </style>
</head>

<body>
    <div class="carousel slide" id="demo" data-bs-ride="carousel">
        <div class="carousel-indicators">
            <button type="button" data-bs-target="#demo" 
            data-bs-slide-to="0" class="active"></button>
            <button type="button" data-bs-target="#demo" 
            data-bs-slide-to="1"></button>
            <button type="button" data-bs-target="#demo" 
            data-bs-slide-to="2"></button>
        </div><!-- end carousel-indicators -->
        <div class="carousel-inner">
            <div class="carousel-item active">
                <img src="Image/slide/1.jpg" alt="Image 1" class="d-block w-100">
            </div>
            <div class="carousel-item">
                <img src="Image/slide/2.jpg" alt="Image 2" class="d-block w-100">
            </div>
            <div class="carousel-item">
                <img src="Image/slide/3.jpg" alt="Image 3" class="d-block w-100">
            </div>
        </div><!-- end carousel-inner -->
        <button class="carousel-control-prev" type="button" data-bs-target="#demo" data-bs-slide="prev">
            <span class="carousel-control-prev-icon"></span>
        </button>
        <button class="carousel-control-next" type="button" data-bs-target="#demo" data-bs-slide="next">
            <span class="carousel-control-next-icon"></span>
        </button>
    </div><!-- end carousel -->
</body>

</html>
