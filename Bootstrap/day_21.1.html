<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
</head>
<body>
    <div class="container">
        <form>
            <div class="my-3">
                <label for="fname" class="form-label">First Name</label>
                <input type="text" id="fName" class="form-control form-control-lg">
            </div>
            <div class="my-3">
                <label for="lname" class="form-label">Last Name</label>
                <input type="text" id="lName" class="form-control form-control-sm">                                                                                                                                                                                                                                                                                                                                                                                                                                                  
            </div>
            <div class="my-3">
                <label for="gender" class="form-label">Gender</label>
                <select id="gender" class="form-select">
                    <option value="M">Male</option>
                    <option value="F">Female</option>
                </select>
            </div>
            <div class="my-3">
                <label for="dob" class="form-label">Date of Birth</label>
                <input type="date" id="dob" class="form-control">
            </div>
            <div class="my-3">
                <label for="skill" class="form-label">Skill</label>
                <div >
                    <input type="checkbox" class="form-check-input" checked>
                    <label class="form-check-label me-4">HTML</label>
                    <input type="checkbox" class="form-check-input" checked>
                    <label class="form-check-label me-4">CSS</label>
                    <input type="checkbox" class="form-check-input">
                    <label class="form-check-label me-4">JavaScript</label>
                    <input type="checkbox" class="form-check-input">
                    <label class="form-check-label me-4">Bootstrap</label>
                </div>
            </div>
            <div class="my-3">
                <label for="status" class="form-label fw-semibold">Status</label>
                <div >
                    <input type="radio" class="form-check-input" name="rdStatus">
                    <label class="form-check-label me-4">Single</label>
                    <input type="radio" class="form-check-input" name="rdStatus">
                    <label class="form-check-label me-4">Married</label>
                </div>
            </div>
            <div class="my-3">
                <div class="form-check form-switch">
                    <input type="checkbox" id="confirm" class="form-check-input">
                    <label class="form-check-label">Confirm condition.......</label>
                </div>
            </div>
            <div class="input-group">
                <button type="button" class="btn btn-outline-primary">SAVE</button>
                <button type="button" class="btn btn-outline-warning">CLEAR</button>
            </div>
        </form>
    </div>
</body>
</html>
