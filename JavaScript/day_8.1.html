<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h4>Cities</h4>
    <script>
        let cities=["Phnom Penh","Kandal","Takeo","Kep","Kampot","Siem Reap"]
        for (i=0; i<cities.length; i++){
            document.writeln("<ul>");
                document.writeln("<li>"+cities[i]+"</li>");
            document.writeln("</ul>");
        }
    </script>
</body>
</html>
