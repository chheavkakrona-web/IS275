<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        h3{
            padding: 0;
            margin: 0;
        }
        table, td{
            border: 2px solid green;
        }
        td{
            padding: 5px;
        }
        table{
            border-collapse: collapse;
            margin-bottom: 90px;
        }
    </style>
</head>
<body>
    <table border="1">
    <script>
        let books=["Java","PHP","Python","HTML","CSS","C++","C#"]
        for (i=0; i<books.length; i++){
            b=i+1;
            document.writeln("<h3>"+b+" "+books[i]+"</h3>");
            document.writeln("<tr>");
                document.writeln("<td>"+Number(i+1)+"</td>");
                document.writeln("<td>"+books[i]+"</td>");
            document.writeln("</tr>");
        }
    </script>
    </table>
</body>
</html>
