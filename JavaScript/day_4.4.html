<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        for(let i=1;i<=10;i++){
            document.write("<h2>"+i+". Hello World. </h2>")
            for(let j=1;j<=3;j++){
                document.write("<h5>"+j+". Hello World. </h5>")
            }
        }
    </script>
</body>
