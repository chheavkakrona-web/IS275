<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        h3{
            padding: p;
            margin: 0;
        }
    </style>
</head>
<body>
    <h3>For Loop</h3>
    <script>
    for(let i=1;i<=10;i++){
            document.write("<h2>"+i+". For Loop. </h2>")
            for(let j=1;j<=3;j++){
                document.write("<h5>"+j+". Inner For Loop. </h5>")
            }
        }
    </script>
    <script>
    let a=1;
    while (a<=10){
            document.write("<h5>"+a+". This is while loop. </h5>")
            a++;
        }
    </script>
</body>
</html>
