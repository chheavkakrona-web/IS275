<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        for(let i=1;i<=10;i++){
            document.write("<h5>"+i+". Hello World. </h5>")
        }
        let a=1;
        while (a<=10){
            document.write("<h5>"+a+". This is while loop. </h5>")
            a++;
        }
        for(j=10;j>=1;j--){
            document.write("<h5>"+j+". Hello World. </h5>")
        }
    </script>
</body>
</html>
